name: Daily Job Scraper

on:
  schedule:
    # Runs every day at 6:00 AM UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      source:
        description: 'Job source to scrape'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - linkedin
          - careers_future
      limit:
        description: 'Maximum jobs per query'
        required: false
        default: '10'
        type: string

env:
  PYTHON_VERSION: '3.13'

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    
    concurrency:
      group: daily-scraper
      cancel-in-progress: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Cache spaCy model
        uses: actions/cache@v3
        with:
          path: ~/.cache/spacy
          key: spacy-model-v1
          restore-keys: |
            spacy-model-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt --no-cache-dir
      
      - name: Download spaCy model (cached)
        run: |
          python -m spacy download en_core_web_sm 2>&1 | grep -v "already installed" || true
      
      - name: Create logs directory
        run: mkdir -p logs
      
      - name: Run job scraper with timeout protection
        timeout-minutes: 45
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          PYTHONUNBUFFERED: '1'
        run: |
          python scraper.py \
            --source ${{ github.event.inputs.source || 'all' }} \
            --limit ${{ github.event.inputs.limit || '10' }} 2>&1 | tee logs/scraper.log
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_number }}
          path: logs/
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Job Scraper Failed - ${new Date().toISOString()}`,
              body: 'The daily job scraper workflow failed. Check the logs (artifact) for details.',
              labels: ['automation', 'bug']
            })
