name: Daily Job Scraper

on:
  schedule:
    # Runs every day at 6:00 AM UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      source:
        description: 'Job source to scrape'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - linkedin
          - careers_future
      limit:
        description: 'Maximum jobs per query'
        required: false
        default: '50'
        type: string

env:
  PYTHON_VERSION: '3.13'

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    concurrency:
      group: daily-scraper
      cancel-in-progress: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Cache spaCy model
        uses: actions/cache@v3
        with:
          path: ~/.cache/spacy
          key: spacy-model-v1
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download spaCy model
        run: |
          python -m spacy download en_core_web_sm
      
      - name: Run job scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python scraper.py \
            --source ${{ github.event.inputs.source || 'all' }} \
            --limit ${{ github.event.inputs.limit || '50' }}
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_number }}
          path: |
            *.log
            logs/
          retention-days: 30
      
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Job Scraper Failed - ${new Date().toISOString()}`,
              body: 'The daily job scraper workflow failed. Check the logs for details.',
              labels: ['automation', 'bug']
            })
